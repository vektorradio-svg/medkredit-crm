<title>MedKredit CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: fixed left rail on desktop, bottom tab bar on phones; right-side drawer for an installment plan */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7EDEA; --fg:#14201B; --muted:#5A6A63; --line:#D3DCD8;
  --accent:#1D6A50; --accent-soft:#DCEDE6; --accent-ink:#FFFFFF;
  --ok:#1E8048; --ok-soft:#DDF1E4; --warn:#9A6411; --warn-soft:#F7EBD3; --bad:#B8352A; --bad-soft:#F8E0DC; --info:#2C659B; --info-soft:#DDE9F4;
  --f-display:"Unbounded","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --side:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2723; --fg:#E2EBE7; --muted:#90A29A; --line:#28352F;
  --accent:#55B48F; --accent-soft:#1B3329; --accent-ink:#0B1310;
  --ok:#52C483; --ok-soft:#163323; --warn:#E3AA4B; --warn-soft:#3A2C14; --bad:#F06C5C; --bad-soft:#3D1D19; --info:#70A9DF; --info-soft:#17293A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2723; --fg:#E2EBE7; --muted:#90A29A; --line:#28352F;
  --accent:#55B48F; --accent-soft:#1B3329; --accent-ink:#0B1310;
  --ok:#52C483; --ok-soft:#163323; --warn:#E3AA4B; --warn-soft:#3A2C14; --bad:#F06C5C; --bad-soft:#3D1D19; --info:#70A9DF; --info-soft:#17293A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:20px}
.logo{font:600 17px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;padding:0 8px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--f-display);font-style:normal}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.me{display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.main{min-width:0;padding-block:24px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:600 22px/1.2 var(--f-display);letter-spacing:-.02em;margin-right:auto}
.demo-bar{background:var(--info-soft);color:var(--info);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabbar{display:none}
.mob-only{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;color:var(--fg)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .num{font-size:12px;opacity:.75}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h2 .lnk{margin-left:auto;font-weight:500;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font:500 22px/1.15 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-active{background:var(--info-soft);color:var(--info)}
.st-overdue{background:var(--bad-soft);color:var(--bad)}
.st-closed{background:var(--ok-soft);color:var(--ok)}
.st-cancelled{background:var(--surface-2);color:var(--muted)}
.st-paid{background:var(--ok-soft);color:var(--ok)}
.st-partial{background:var(--warn-soft);color:var(--warn)}
.st-upcoming{background:var(--surface-2);color:var(--muted)}
.st-pending{background:var(--warn-soft);color:var(--warn)}
.badge{font:600 11px var(--f-num);background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td small,.row small{display:block;color:var(--muted);font-size:12px}

/* plan list rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:72px minmax(0,1.6fr) minmax(0,1.2fr) 110px 150px 104px 100px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding-block:9px}
.row.head:hover{background:none}
.row .code{font:500 12px var(--f-num);color:var(--muted)}
.row .r{text-align:right}
.row.overdue{box-shadow:inset 3px 0 0 var(--bad)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;flex:1 1 220px}
.toolbar select.inp{flex:0 1 200px}

/* mini lists on dashboard */
.mini{display:flex;flex-direction:column}
.mini button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.mini button:last-child{border-bottom:0}
.mini button:hover .nm{color:var(--accent)}
.mini .nm{font-weight:500}
.mini .meta{font-size:12px;color:var(--muted)}
.mini .amt{text-align:right}
.mini .amt.bad{color:var(--bad)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* doctors cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.dcard h3{font-size:15px;font-weight:600}
.dcard .spec{font-size:12px;color:var(--muted)}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding-top:12px;border-top:1px solid var(--line)}
.dstats div{display:flex;flex-direction:column;gap:2px}
.dstats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* new plan */
.np{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:16px;align-items:start}
.np form{display:flex;flex-direction:column;gap:16px}
.np fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.np legend{font-weight:600;padding:0 6px;font-size:13px}
.preview{position:sticky;top:20px}
.monthly{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.monthly .val{font:500 30px/1.1 var(--f-num);letter-spacing:-.03em;color:var(--accent)}
.monthly small{color:var(--muted)}
.sched{max-height:360px;overflow:auto}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.42);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(640px,100%);height:100%;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start;z-index:2}
.dhead h2{font:600 18px/1.25 var(--f-display);letter-spacing:-.02em}
.dhead .sub{color:var(--muted);font-size:13px;margin-top:4px}
.dbody{padding:16px 20px 40px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.facts span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.facts b{font:500 15px var(--f-num);font-variant-numeric:tabular-nums}
.facts .bad b{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.payform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.payform .full{grid-column:1/-1}
.modal-wrap{position:fixed;inset:0;background:rgba(8,14,12,.42);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:600}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px}
.lbox .logo{padding:0;font-size:20px}
.lbox p{margin:0;color:var(--muted)}
.ulist{display:flex;flex-direction:column;gap:8px}
.ulist button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.ulist button:hover{border-color:var(--accent)}
.muted{color:var(--muted)}
.right{margin-left:auto}

/* today tasks */
.today-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.today-head .prog{flex:1 1 220px;display:flex;flex-direction:column;gap:6px;min-width:0}
.today-head .prog b{font:500 15px var(--f-num)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);margin:20px 0 8px}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start}
.task.bad{box-shadow:inset 3px 0 0 var(--bad)}
.task.warn{box-shadow:inset 3px 0 0 var(--warn)}
.task.info{box-shadow:inset 3px 0 0 var(--info)}
.task.done{box-shadow:inset 3px 0 0 var(--ok);background:var(--bg)}
.task .nm{font-weight:600}
.task .meta{font-size:12px;color:var(--muted)}
.task .amt{text-align:right}
.task .amt b{font:500 15px var(--f-num)}
.task .line{grid-column:1/-1;font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 10px;min-width:0;overflow-wrap:anywhere}
.task .line.warn{background:var(--warn-soft);color:var(--warn);font-weight:500}
.task .line.bad{background:var(--bad-soft);color:var(--bad);font-weight:500}
.task .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.check{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ok);margin-left:auto}
/* notes & log timeline */
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .when{font:500 12px/1.5 var(--f-num);color:var(--muted)}
.tl .who{font-size:12px;color:var(--muted)}
.tl .txt{min-width:0;overflow-wrap:anywhere}
.tl.click{cursor:pointer}
.tl.click:hover .txt{color:var(--accent)}
.ntype{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-right:6px;white-space:nowrap}
.ntype.promise{background:var(--warn-soft);color:var(--warn)}
.ntype.noanswer{background:var(--bad-soft);color:var(--bad)}
.ntype.call,.ntype.whatsapp{background:var(--info-soft);color:var(--info)}
.noteform{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px;margin-bottom:6px}
.noteform .full{grid-column:1/-1}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.ucard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ucard.idle{opacity:.6}
.ucard .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:var(--muted)}
.ucard .stats b{display:block;font:500 14px var(--f-num);color:var(--fg)}
.sheet-list{display:flex;flex-direction:column;gap:2px}
.sheet-list button{display:flex;gap:12px;align-items:center;padding:12px;border:0;background:none;border-radius:8px;text-align:left;font-weight:500;cursor:pointer}
.sheet-list button:hover,.sheet-list button[aria-current="page"]{background:var(--surface-2)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid,.np{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
  .row{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 140px 100px}
  .row .c-code,.row .c-total,.row .c-next{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mob-only{display:flex}
  .main{padding-block:16px calc(90px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:18px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:10px;font-weight:600;padding:5px 2px;cursor:pointer;position:relative}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar .badge{position:absolute;top:0;left:55%;font-size:9px;padding:0 5px}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .row.head{display:none}
  .row .c-doc{grid-column:1;font-size:12px;color:var(--muted)}
  .row .c-prog{grid-column:1/-1}
  .row .c-rem{grid-row:1;grid-column:2}
  .row .c-st{grid-row:2;grid-column:2;justify-self:end}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .payform{grid-template-columns:1fr 1fr}

function buildSchedule(total, down, months, start) {
  total = r2(total); down = r2(down); months = Math.max(1, +months || 1);
  const rows = [];
  if (down > 0) rows.push({ n: 0, due: start, amount: down });
  const rest = r2(total - down);
  const base = Math.floor(rest / months * 100) / 100;
  for (let i = 1; i <= months; i++) rows.push({ n: i, due: addMonths(start, i), amount: i < months ? base : r2(rest - base * (months - 1)) });
  return rows;
}

/* распределяет все платежи по графику по порядку и считает статус */
function calc(p) {
  const pays = (p.payments || []);
  const paidTotal = sum(pays.map(x => x.amount));
  let pool = paidTotal;
  const rows = (p.schedule || []).map(r => {
    const paid = r2(Math.min(pool, r.amount)); pool = r2(pool - paid);
    const rem = r2(r.amount - paid);
    let st = rem <= 0.004 ? 'paid' : r.due < TODAY ? 'overdue' : paid > 0 ? 'partial' : 'upcoming';
    return { ...r, paid, rem, st };
  });
  const remaining = Math.max(0, r2(p.total - paidTotal));
  const over = rows.filter(r => r.st === 'overdue');
  const overdueAmt = p.cancelled ? 0 : sum(over.map(r => r.rem));
  const next = rows.find(r => r.rem > 0.004);
  const status = p.cancelled ? 'cancelled' : remaining <= 0.004 ? 'closed' : overdueAmt > 0 ? 'overdue' : 'active';
  return { rows, paidTotal, remaining, overdueAmt, next, status, daysOver: over.length ? diffDays(over[0].due, TODAY) : 0, pct: p.total ? Math.min(100, paidTotal / p.total * 100) : 0 };
}

const FirebaseBackend = {
  mode: 'firebase', unsubs: [],
  loadScript: src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('load ' + src)); document.head.appendChild(s); }),
  async init() {
    const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    try {
      await this.loadScript(base + 'firebase-app-compat.js');
      await this.loadScript(base + 'firebase-auth-compat.js');
      await this.loadScript(base + 'firebase-firestore-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth(); this.fs = firebase.firestore();
    } catch (e) { state.loading = false; state.error = t('fbError') + ': ' + e.message; render(); return; }
    this.auth.onAuthStateChanged(async u => {
      this.unsubs.forEach(f => f()); this.unsubs = [];
      if (!u) { state.me = null; state.loading = false; render(); return; }
      state.loading = true; render();
      const ref = this.fs.collection('users').doc(u.uid);
      let snap = await ref.get();
      if (!snap.exists) { await ref.set({ name: u.displayName || u.email.split('@')[0], email: u.email, role: 'pending', createdAt: TODAY }); snap = await ref.get(); }
      state.me = { id: u.uid, ...snap.data() };
      if (state.me.role !== 'pending') {
        state.view = homeView(state.me.role);
        const cols = ['users', 'doctors', 'clients', 'plans', 'notes'];
        if (state.me.role === 'admin') cols.push('activity');
        for (const col of cols) {
          const q = col === 'activity' ? this.fs.collection(col).where('day', '>=', addDays(TODAY, -90)) : this.fs.collection(col);
          this.unsubs.push(q.onSnapshot(s => {
            DB[col] = s.docs.map(d => ({ id: d.id, ...d.data() }));
            if (col === 'users') { const fresh = DB.users.find(x => x.id === state.me.id); if (fresh) state.me = fresh; }
            recalc(); state.loading = false; render();
          }, err => { state.error = t('fbError') + ': ' + err.message; state.loading = false; render(); }));
        }
        logLoginOnce();
      } else { state.loading = false; render(); }
    });
  },
  async save(col, obj) { const { id, ...data } = obj; await this.fs.collection(col).doc(id).set(JSON.parse(JSON.stringify(data))); },
  async remove(col, id) { await this.fs.collection(col).doc(id).delete(); },
  async signIn(email, pass) { await this.auth.signInWithEmailAndPassword(email, pass); },
  async signUp(name, email, pass) { const c = await this.auth.createUserWithEmailAndPassword(email, pass); await c.user.updateProfile({ displayName: name }); await this.fs.collection('users').doc(c.user.uid).set({ name, email, role: 'pending', createdAt: TODAY }); state.me = { id: c.user.uid, name, email, role: 'pending' }; render(); },
  async logout() { await this.auth.signOut(); }
};

function viewDashboard() {
  const live = livePlans();
  const calcs = live.map(p => [p, C(p)]);
  const open = calcs.filter(([, c]) => c.status === 'active' || c.status === 'overdue');
  const portfolio = sum(open.map(([, c]) => c.remaining));
  const mk = monthKey(TODAY);
  const collected = sum(live.flatMap(p => p.payments || []).filter(x => monthKey(x.date) === mk).map(x => x.amount));
  const expected = sum(live.flatMap(p => p.schedule).filter(r => monthKey(r.due) === mk).map(r => r.amount));
  const overdue = calcs.filter(([, c]) => c.status === 'overdue');
  const overdueAmt = sum(overdue.map(([, c]) => c.overdueAmt));
  const financed = sum(live.map(p => p.total));

  // 6 месяцев
  const months = []; for (let i = 5; i >= 0; i--) { const d = parse(TODAY.slice(0,8) + '01'); d.setMonth(d.getMonth() - i); months.push(iso(d).slice(0, 7)); }
  const series = months.map(m => ({ m,
    exp: sum(live.flatMap(p => p.schedule).filter(r => monthKey(r.due) === m).map(r => r.amount)),
    col: sum(live.flatMap(p => p.payments || []).filter(x => monthKey(x.date) === m).map(x => x.amount)) }));

  const upcoming = calcs.flatMap(([p, c]) => c.rows.filter(r => r.rem > 0.004 && r.due >= TODAY && r.due <= addDays(TODAY, 7)).map(r => ({ p, r }))).sort((a, b) => a.r.due.localeCompare(b.r.due));
  const overList = overdue.sort((a, b) => b[1].daysOver - a[1].daysOver);

  const docRows = DB.doctors.map(d => {
    const ps = calcs.filter(([p]) => p.doctorId === d.id);
    return { d, n: ps.length, fin: sum(ps.map(([p]) => p.total)), rem: sum(ps.filter(([, c]) => c.status !== 'closed').map(([, c]) => c.remaining)), ov: sum(ps.map(([, c]) => c.overdueAmt)), ovn: ps.filter(([, c]) => c.status === 'overdue').length };
  }).sort((a, b) => b.rem - a.rem);

  const pctCol = expected ? Math.round(collected / expected * 100) : 0;
  return `
  <div class="kpis">
    <div class="kpi"><span class="lbl">${t('portfolio')}</span><span class="val">${money(portfolio)}</span><span class="sub">${t('portfolioSub')} · ${open.length} ${t('cnt_plans')}</span></div>
    <div class="kpi"><span class="lbl">${t('collectedMonth')}</span><span class="val">${money(collected)}</span><span class="sub">${pctCol}% ${t('ofExpected')} ${money(expected)}</span><div class="bar"><i style="width:${Math.min(100, pctCol)}%"></i></div></div>
    <div class="kpi ${overdueAmt ? 'bad' : ''}"><span class="lbl">${t('overdue')}</span><span class="val">${money(overdueAmt)}</span><span class="sub">${overdue.length} ${t('overdueSub')}</span></div>
    <div class="kpi"><span class="lbl">${t('activePlans')}</span><span class="val">${open.length}</span><span class="sub">${t('financed')} ${money(financed)}</span></div>
  </div>
  <div class="dash-grid">
    <div class="panel chart"><h2>${t('collections')}</h2>${chartSvg(series)}<div class="legend"><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>${t('expected')}</span><span><i style="background:var(--accent)"></i>${t('collected')}</span></div></div>
    <div class="panel"><h2>${t('overdueList')} ${overList.length ? `<span class="badge">${overList.length}</span>` : ''}<button class="lnk" data-act="planFilter" data-f="overdue">${t('showAll')}</button></h2>
      ${overList.length ? `<div class="mini">${overList.slice(0, 6).map(([p, c]) => `<button data-act="open" data-id="${p.id}"><span class="nm">${esc(byId('clients', p.clientId)?.name)}</span><span class="amt bad num">${money(c.overdueAmt)}</span><span class="meta">${esc(docName(p.doctorId))}</span><span class="meta amt">${c.daysOver} ${t('daysShort')}</span></button>`).join('')}</div>` : `<div class="empty">${t('noOverdue')}</div>`}
    </div>
  </div>
  <div class="dash-grid">
    <div class="panel"><h2>${t('byDoctor')}</h2><div class="tw"><table><thead><tr><th>${t('doctor')}</th><th class="r">${t('plansCount')}</th><th class="r">${t('financed')}</th><th class="r">${t('remaining')}</th><th class="r">${t('overdue')}</th></tr></thead><tbody>
      ${docRows.map(x => `<tr class="click" data-act="docPlans" data-id="${x.d.id}"><td><b>${esc(x.d.name)}</b><small>${esc(x.d.clinic || '')}</small></td><td class="r num">${x.n}</td><td class="r num">${money(x.fin)}</td><td class="r num">${money(x.rem)}</td><td class="r num" style="color:${x.ov ? 'var(--bad)' : 'var(--muted)'}">${x.ov ? money(x.ov) : '—'}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="panel"><h2>${t('upcoming')}</h2>
      ${upcoming.length ? `<div class="mini">${upcoming.slice(0, 7).map(({ p, r }) => { const dd = diffDays(TODAY, r.due); return `<button data-act="open" data-id="${p.id}"><span class="nm">${esc(byId('clients', p.clientId)?.name)}</span><span class="amt num">${money(r.rem)}</span><span class="meta">${fd(r.due)}</span><span class="meta amt">${dd === 0 ? t('today') : `${t('inDays')} ${dd} ${t('daysShort')}`}</span></button>`; }).join('')}</div>` : `<div class="empty">${t('noUpcoming')}</div>`}
    </div>
  </div>`;
}
function chartSvg(series) {
  const W = 600, H = 230, L = 56, R = 8, T = 12, Bm = 28;
  const max = Math.max(1, ...series.flatMap(s => [s.exp, s.col]));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - Bm) * (1 - v / top);
  const gw = (W - L - R) / series.length, bw = Math.min(26, gw * 0.3);
  const ticks = []; for (let v = 0; v <= top + 0.01; v += step) ticks.push(v);
  const kfmt = v => v >= 1000 ? (v / 1000).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + 'k' : String(v);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('collections')}">
   ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${kfmt(v)}</text>`).join('')}
   ${series.map((s, i) => { const cx = L + gw * i + gw / 2; const lbl = parse(s.m + '-01').toLocaleDateString(locale(), { month: 'short' });
     return `<rect x="${cx - bw - 2}" y="${y(s.exp)}" width="${bw}" height="${y(0) - y(s.exp)}" rx="3" fill="var(--surface-2)" stroke="var(--line)"><title>${t('expected')}: ${money(s.exp)}</title></rect>
     <rect x="${cx + 2}" y="${y(s.col)}" width="${bw}" height="${y(0) - y(s.col)}" rx="3" fill="var(--accent)"><title>${t('collected')}: ${money(s.col)}</title></rect>
     <text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${i === series.length - 1 ? 'var(--fg)' : 'var(--muted)'}" font-weight="${i === series.length - 1 ? 600 : 400}">${esc(lbl)}</text>`; }).join('')}
  </svg>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

/* ---------- рассрочки ---------- */
function filteredPlans() {
  const q = state.planSearch.trim().toLowerCase();
  return DB.plans.filter(p => {
    const c = C(p);
    if (state.planFilter !== 'all' && c.status !== state.planFilter) return false;
    if (state.planDoctor && p.doctorId !== state.planDoctor) return false;
    if (q) { const cl = byId('clients', p.clientId) || {}; const hay = [cl.name, cl.phone, (cl.phone || '').replace(/\D/g, ''), p.code, p.procedure].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => { const o = { overdue: 0, active: 1, closed: 2, cancelled: 3 }; const ca = C(a), cb = C(b); return (o[ca.status] - o[cb.status]) || (cb.daysOver - ca.daysOver) || ((ca.next?.due || '9') .localeCompare(cb.next?.due || '9')); });
}
function viewPlans() {
  const counts = { all: DB.plans.length }; DB.plans.forEach(p => { const s = C(p).status; counts[s] = (counts[s] || 0) + 1; });
  return `<div class="toolbar">
    <input class="inp" id="planSearch" type="search" placeholder="${t('search')}" value="${esc(state.planSearch)}">
    <select class="inp" id="planDoctor"><option value="">${t('allDoctors')}</option>${DB.doctors.map(d => `<option value="${d.id}" ${state.planDoctor === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>
  </div>
  <div class="chips" style="margin-bottom:14px">${['all', 'overdue', 'active', 'closed', 'cancelled'].map(f => `<button class="chip" data-act="planFilter" data-f="${f}" aria-pressed="${state.planFilter === f}">${f === 'all' ? t('all') : t('st_' + f)} <span class="num">${counts[f] || 0}</span></button>`).join('')}</div>
  <div id="plansList">${plansListHtml()}</div>`;
}
function plansListHtml() {
  const list = filteredPlans();
  if (!list.length) return `<div class="list"><div class="empty"><b>${t('nothing')}</b>${t('nothingSub')}</div></div>`;
  return `<div class="list"><div class="row head"><span class="c-code">${t('code')}</span><span>${t('client')}</span><span class="c-doc">${t('doctor')}</span><span class="r c-total">${t('total')}</span><span class="c-prog">${t('paid')}</span><span class="r c-rem">${t('remaining')}</span><span class="c-st">${t('status')}</span></div>
  ${list.map(p => { const c = C(p); const cl = byId('clients', p.clientId) || {};
    return `<button class="row ${c.status === 'overdue' ? 'overdue' : ''}" data-act="open" data-id="${p.id}">
     <span class="code c-code">${esc(p.code)}</span>
     <span><b>${esc(cl.name)}</b><small>${esc(cl.phone || '')} · ${esc(p.procedure)}</small></span>

function readPlanForm() {
  const v = id => $('#' + id)?.value ?? '';
  return { name: v('np_name').trim(), phone: v('np_phone').trim(), doctorId: v('np_doc'), procedure: v('np_proc').trim(), managerId: v('np_mgr'), total: r2(v('np_total')), down: r2(v('np_down')), months: +v('np_months'), start: v('np_start') || TODAY, note: v('np_note').trim() };
}
function updatePreview() {
  const box = $('#schedPreview'); if (!box) return;
  const f = readPlanForm();
  if (!(f.total > 0) || f.down >= f.total) { box.innerHTML = `<div class="empty">${t('errSum')}</div>`; return; }
  const s = buildSchedule(f.total, f.down, f.months, f.start);
  const mon = s.find(r => r.n === 1)?.amount || 0;
  box.innerHTML = `<div class="monthly"><small>${t('monthly')}</small><span class="val">${money(mon)}</span><small>${f.months} × · ${t('down')} ${money(f.down)}</small></div>
   <h2>${t('schedule')}</h2><div class="sched"><table><thead><tr><th>#</th><th>${t('due')}</th><th class="r">${t('amount')}</th></tr></thead><tbody>
   ${s.map(r => `<tr><td class="num">${r.n === 0 ? '—' : r.n}</td><td>${r.n === 0 ? t('downRow') + ' · ' : ''}${fd(r.due)}</td><td class="r num">${money(r.amount)}</td></tr>`).join('')}
   <tr><td></td><td><b>${t('total')}</b></td><td class="r num"><b>${money(f.total)}</b></td></tr></tbody></table></div>`;
}
async function submitPlan() {
  const f = readPlanForm(); const err = $('#np_err');
  const fail = m => { err.textContent = m; err.hidden = false; };
  if (!f.name || !f.phone) return fail(t('errClient'));
  if (!f.doctorId) return fail(t('errDoctor'));
  if (!(f.total > 0) || f.down >= f.total || f.down < 0) return fail(t('errSum'));
  const digits = f.phone.replace(/\D/g, '');
  let client = DB.clients.find(c => (c.phone || '').replace(/\D/g, '') === digits);
  if (!client) { client = { id: uid(), name: f.name, phone: f.phone, createdAt: TODAY }; await save('clients', client); }
  const n = DB.plans.reduce((m, p) => Math.max(m, +String(p.code).replace(/\D/g, '') || 0), 0) + 1;
  const plan = { id: uid(), code: 'R-' + String(n).padStart(4, '0'), clientId: client.id, doctorId: f.doctorId, managerId: f.managerId || state.me.id, procedure: f.procedure,
    total: f.total, down: f.down, months: f.months, startDate: f.start, schedule: buildSchedule(f.total, f.down, f.months, f.start), payments: [], note: f.note, cancelled: false, createdAt: TODAY, createdBy: state.me.id };
  state.view = 'plans'; state.planFilter = 'all'; state.planSearch = '';
  document.activeElement?.blur?.();
  await save('plans', plan, t('created'));
  await log('plan.create', { amount: plan.total, code: plan.code, name: client.name, planId: plan.id, clientId: client.id });
  state.drawer = plan.id; render();
}

/* ---------- сегодня: кому звонить ---------- */
const scopeNow = () => state.todayScope || (state.me?.role === 'manager' ? 'mine' : 'all');
function todayTasks(scope) {
  const soonTo = addDays(TODAY, 3), out = [];
  livePlans().forEach(p => {
    if (scope === 'mine' && p.managerId !== state.me.id) return;
    const c = C(p); if (c.status === 'closed') return;
    let kind = null, amount = 0, due = null;
    if (c.overdueAmt > 0) { kind = 'overdue'; amount = c.overdueAmt; due = c.rows.find(r => r.st === 'overdue').due; }
    else if (c.next && c.next.due === TODAY) { kind = 'today'; amount = c.next.rem; due = c.next.due; }
    else if (c.next && c.next.due > TODAY && c.next.due <= soonTo) { kind = 'soon'; amount = c.next.rem; due = c.next.due; }
    if (!kind) return;
    const notes = clientNotes(p.clientId);
    const last = notes[0];
    const done = notes.some(n => n.day === TODAY);
    const pr = notes.find(n => n.type === 'promise' && n.promiseDate);
    const promise = pr && !(p.payments || []).some(x => x.date >= pr.day) ? pr : null;
    out.push({ p, c, cl: byId('clients', p.clientId) || {}, kind, amount, due, last, done, promise });
  });
  return out;
}
function reminderText(p, c) {
  const cl = byId('clients', p.clientId) || {};
  const over = c.overdueAmt > 0, tgt = c.next;
  return (over ? t('remindOver') : t('remindTpl')).replace('{name}', cl.name || '').replace('{proc}', p.procedure || '').replace('{amount}', money(over ? c.overdueAmt : (tgt?.rem || 0))).replace('{date}', fd(tgt?.due));
}
const noteLine = n => `<span class="ntype ${n.type}">${t('n_' + n.type)}</span>${esc(n.text || '')} <span class="muted" style="font-size:12px">— ${esc(userName(n.by))}, ${n.day === TODAY ? t('today') : fd(n.day)} ${hhmm(n.at)}</span>`;
function taskCard(x) {
  const { p, c, cl, kind, amount, due, last, done, promise } = x;
  const dd = diffDays(TODAY, due);
  const when = kind === 'overdue' ? `${t('overdueDays')} ${c.daysOver} ${t('daysShort')}` : dd === 0 ? t('dueToday') : dd === 1 ? t('dueTomorrow') : fd(due);
  let promLine = '';
  if (promise) promLine = promise.promiseDate < TODAY ? `<div class="line bad">${t('promiseBroken')} ${fd(promise.promiseDate)}</div>` : `<div class="line warn">${t('promiseBy')} ${fd(promise.promiseDate)}</div>`;
  const cls = done ? 'done' : kind === 'overdue' ? 'bad' : kind === 'today' ? 'warn' : 'info';
  return `<div class="task ${cls}">
   <div style="min-width:0"><div class="nm">${esc(cl.name)}</div><div class="meta num">${esc(cl.phone || '')}</div><div class="meta">${esc(docName(p.doctorId))} · ${esc(p.procedure)} · ${esc(p.code)}${scopeNow() === 'all' ? ' · ' + esc(userName(p.managerId)) : ''}</div></div>
   <div class="amt"><b style="${kind === 'overdue' ? 'color:var(--bad)' : ''}">${money(amount)}</b><div class="meta">${when}</div></div>
   ${promLine}
   ${last ? `<div class="line">${noteLine(last)}</div>` : ''}
   <div class="acts"><button class="btn sm pri" data-act="noteModal" data-id="${p.id}">${ic('note')}${t('addNote')}</button><button class="btn sm" data-act="copyTaskRemind" data-id="${p.id}">${ic('copy')}${t('reminder')}</button><button class="btn sm ghost" data-act="open" data-id="${p.id}">${t('details')}</button>
   ${done ? `<span class="check">${ic('ok')}${t('doneToday')}</span>` : ''}</div></div>`;
}
function viewToday() {
  const scope = scopeNow(), list = todayTasks(scope);
  const doneN = list.filter(x => x.done).length;
  const open = list.filter(x => !x.done);
  const sec = (k, items) => items.length ? `<div class="sec-h">${t('sec_' + k)} <span class="badge" style="background:${k === 'overdue' ? 'var(--bad)' : k === 'done' ? 'var(--ok)' : 'var(--muted)'}">${items.length}</span></div><div class="tasks">${items.map(taskCard).join('')}</div>` : '';
  const pct = list.length ? Math.round(doneN / list.length * 100) : 100;
  return `<div class="today-head">
    <div class="chips"><button class="chip" data-act="todayScope" data-s="mine" aria-pressed="${scope === 'mine'}">${t('scopeMine')}</button><button class="chip" data-act="todayScope" data-s="all" aria-pressed="${scope === 'all'}">${t('scopeAll')}</button></div>
    <div class="prog"><span class="muted" style="font-size:12px">${t('worked')}: <b>${doneN}</b> ${t('of')} <b>${list.length}</b></span><div class="bar"><i style="width:${pct}%;background:var(--ok)"></i></div></div>
    <span class="muted num" style="font-size:13px">${fd(TODAY)}</span>
  </div>
  ${list.length ? '' : `<div class="panel" style="margin-top:16px"><div class="empty"><b>${t('todayEmpty')}</b>${t('todayEmptySub')}</div></div>`}
  ${sec('overdue', open.filter(x => x.kind === 'overdue').sort((a, b) => b.c.daysOver - a.c.daysOver))}
  ${sec('today', open.filter(x => x.kind === 'today'))}
  ${sec('soon', open.filter(x => x.kind === 'soon').sort((a, b) => a.due.localeCompare(b.due)))}
  ${sec('done', list.filter(x => x.done))}`;
}

   </button>`).join('')}</div>
  <div class="panel"><h2>${t('log')} · ${fd(day)} <span class="muted" style="font-weight:400">${items.length} ${t('actions')}</span></h2>
   ${items.length ? `<div class="timeline">${items.map(a => `<div class="tl ${a.planId ? 'click' : ''}" ${a.planId ? `data-act="open" data-id="${a.planId}"` : ''}><span class="when">${hhmm(a.at)}</span><div class="txt">${actText(a)}<div class="who">${esc(userName(a.by))}</div></div></div>`).join('')}</div>` : `<div class="empty">${t('logEmpty')}</div>`}
  </div>`;
}

const VIEWS = { today: viewToday, log: viewLog, dashboard: viewDashboard, plans: viewPlans, new: viewNew, clients: viewClients, doctors: viewDoctors, reports: viewReports, users: viewUsers };

/* ---------- модальные окна ---------- */
function modal(title, fields, onSave, validate) {
  const box = $('#modal');
  box.innerHTML = `<div class="modal-wrap" data-act="closeModal"><form class="modal" id="modalForm"><h3>${title}</h3>${fields}<p class="err" id="m_err" hidden></p><div class="acts"><button type="button" class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn pri" type="submit">${t('save')}</button></div></form></div>`;
  box.querySelector('input,select')?.focus();
  modal.onSave = onSave; modal.validate = validate || null;
}
const closeModal = () => { $('#modal').innerHTML = ''; modal.onSave = null; modal.validate = null; };
const fld = (id, label, val = '', type = 'text', req = true) => `<label class="f">${label}<input class="inp" id="${id}" type="${type}" value="${esc(val)}" ${req ? 'required' : ''}></label>`;

/* ---------------- события ---------------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if ((a === 'closeDrawer' || a === 'closeModal') && el.classList.contains('scrim') || el.classList.contains('modal-wrap')) { if (e.target !== el) return; }
  switch (a) {
    case 'go': closeModal(); state.view = el.dataset.v; state.drawer = null; try { window.scrollTo(0, 0); } catch {} render(); break;
    case 'lang': lang = el.dataset.l; lsSet('mk_lang', lang); $('#app').innerHTML = ''; render(); break;
    case 'loginAs': B.loginAs(id); break;
    case 'logout': state.drawer = null; await B.logout(); break;
    case 'authMode': state.authMode = state.authMode === 'up' ? 'in' : 'up'; render(); break;
    case 'resetDemo': B.reset(); break;
    case 'open': state.drawer = id; state.confirm = null; renderDrawer(); break;
    case 'closeDrawer': state.drawer = null; state.confirm = null; renderDrawer(); break;
    case 'planFilter': state.view = 'plans'; state.planFilter = el.dataset.f; render(); break;
    case 'docPlans': state.view = 'plans'; state.planFilter = 'all'; state.planDoctor = id; state.planSearch = ''; render(); break;
    case 'clientPlans': { if (e.target.closest('button[data-act="clientModal"]')) break; const cl = byId('clients', id); state.view = 'plans'; state.planFilter = 'all'; state.planDoctor = ''; state.planSearch = cl?.phone || ''; render(); break; }
    case 'delPay': state.confirm = 'pay:' + id; renderDrawer(); break;
    case 'delPayYes': { const p = byId('plans', state.drawer); const x = p.payments.find(y => y.id === id); state.confirm = null; await save('plans', { ...p, payments: p.payments.filter(y => y.id !== id) }, t('payDeleted'));
      await log('pay.delete', { amount: x?.amount || 0, code: p.code, name: byId('clients', p.clientId)?.name || '', planId: p.id, clientId: p.clientId }); break; }
    case 'cancelPlan': state.confirm = 'cancel'; renderDrawer(); break;
    case 'confirmOff': state.confirm = null; renderDrawer(); break;
    case 'cancelYes': { const p = byId('plans', state.drawer); state.confirm = null; await save('plans', { ...p, cancelled: true, cancelledBy: state.me.id, cancelledAt: TODAY }, t('planCancelled'));
      await log('plan.cancel', { code: p.code, name: byId('clients', p.clientId)?.name || '', planId: p.id, clientId: p.clientId }); break; }
    case 'restorePlan': { const p = byId('plans', state.drawer); await save('plans', { ...p, cancelled: false }, t('restored'));
      await log('plan.restore', { code: p.code, name: byId('clients', p.clientId)?.name || '', planId: p.id, clientId: p.clientId }); break; }
    case 'moreSheet': moreSheet(); break;
    case 'todayScope': state.todayScope = el.dataset.s; render(); break;
    case 'copyTaskRemind': { const p = byId('plans', id); copyText(reminderText(p, C(p))); break; }
    case 'noteModal': { const p = byId('plans', id); if (!p) break;
      modal(`${t('addNote')} · ${esc(byId('clients', p.clientId)?.name || '')}`,
        `<label class="f">${t('noteType')}<select class="inp" id="nf_type">${['call', 'whatsapp', 'promise', 'noanswer', 'other'].map(k => `<option value="${k}">${t('n_' + k)}</option>`).join('')}</select></label>
         <label class="f">${t('noteText')}<textarea class="inp" id="m_text" maxlength="500"></textarea></label>
         <label class="f" id="nf_promWrap" hidden>${t('promiseDate')}<input class="inp" type="date" id="nf_prom" min="${TODAY}"></label>`,
        async () => addNote(p.clientId, p.id, modal.vals.type, modal.vals.text, modal.vals.prom),
        () => { const type = $('#nf_type').value, text = $('#m_text').value.trim(), prom = $('#nf_prom').value;
          if (!text && type !== 'noanswer') return t('errNote'); if (type === 'promise' && !prom) return t('errPromise');
          modal.vals = { type, text, prom }; return ''; });
      break; }
    case 'logShift': { const d = +el.dataset.d; state.logDay = d === 0 ? TODAY : addDays(state.logDay, d); if (state.logDay > TODAY) state.logDay = TODAY; render(); break; }
    case 'logUserPick': state.logUser = state.logUser === id ? '' : id; render(); break;
    case 'copyRemind': copyText($('#remindTxt').value, '#remindTxt'); break;
    case 'closeModal': closeModal(); break;
    case 'repPreset': { const d = new Date(); const p = el.dataset.p;
      if (p === 'm') { state.repFrom = TODAY.slice(0, 8) + '01'; state.repTo = TODAY; }
      if (p === 'pm') { const s = new Date(d.getFullYear(), d.getMonth() - 1, 1), en = new Date(d.getFullYear(), d.getMonth(), 0); state.repFrom = iso(s); state.repTo = iso(en); }
      if (p === 'y') { state.repFrom = d.getFullYear() + '-01-01'; state.repTo = TODAY; }
      render(); break; }
    case 'copyCsv': copyText(reportCsv().replace(/;/g, '\t')); break;
    case 'exportCsv': { const blob = new Blob(['﻿' + reportCsv()], { type: 'text/csv;charset=utf-8' }); const u = URL.createObjectURL(blob); const ln = document.createElement('a'); ln.href = u; ln.download = `payments_${state.repFrom}_${state.repTo}.csv`; document.body.appendChild(ln); ln.click(); ln.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); break; }
    case 'docModal': { const d = id ? byId('doctors', id) : {};
      modal(id ? t('editDoctor') : t('addDoctor'), fld('m_name', t('docName'), d.name) + fld('m_spec', t('specialty'), d.specialty, 'text', false) + `<div class="grid2">${fld('m_clinic', t('clinic'), d.clinic, 'text', false)}${fld('m_phone', t('phone'), d.phone, 'tel', false)}</div>`,
        async () => { const v = { name: $('#m_name').value.trim(), specialty: $('#m_spec').value.trim(), clinic: $('#m_clinic').value.trim(), phone: $('#m_phone').value.trim() };
          await save('doctors', { ...d, id: d.id || uid(), ...v }, t('saved')); await log('doctor.save', { name: v.name }); }); break; }
    case 'clientModal': { e.stopPropagation(); const c = id ? byId('clients', id) : {};
      modal(id ? t('editClient') : t('addClient'), fld('m_name', t('clientName'), c.name) + fld('m_phone', t('phone'), c.phone, 'tel') + `<label class="f">${t('note')}<textarea class="inp" id="m_note">${esc(c.note || '')}</textarea></label>`,
        async () => { const v = { name: $('#m_name').value.trim(), phone: $('#m_phone').value.trim(), note: $('#m_note').value.trim() }; const cid = c.id || uid();
          await save('clients', { ...c, id: cid, ...v, createdAt: c.createdAt || TODAY }, t('saved')); await log('client.save', { name: v.name, clientId: cid }); }); break; }
    case 'userModal': modal(t('addUser'), fld('m_name', t('name')) + fld('m_email', t('email'), '', 'email', false) + `<label class="f">${t('role')}<select class="inp" id="m_role">${['manager', 'accountant', 'admin'].map(r => `<option value="${r}">${roleLabel(r)}</option>`).join('')}</select></label>`,
        () => save('users', { id: uid(), name: $('#m_name').value.trim(), email: $('#m_email').value.trim(), role: $('#m_role').value }, t('saved'))); break;
  }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'planForm') submitPlan();
  else if (f.id === 'payForm') submitPayment();
  else if (f.id === 'noteForm') submitNote();
  else if (f.id === 'modalForm' && modal.onSave) {
    const msg = modal.validate ? modal.validate() : '';
    if (msg) { const er = $('#m_err'); er.textContent = msg; er.hidden = false; return; }
    const pending = modal.onSave(); closeModal(); await pending; // onSave читает поля синхронно, до закрытия окна
  }
  else if (f.id === 'authForm') {
    const err = $('#au_err');
    try { if (state.authMode === 'up') await B.signUp($('#au_name').value.trim(), $('#au_email').value.trim(), $('#au_pass').value); else await B.signIn($('#au_email').value.trim(), $('#au_pass').value); }
    catch (x) { err.textContent = x.message; err.hidden = false; }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'planSearch') { state.planSearch = e.target.value; $('#plansList').innerHTML = plansListHtml(); }
  else if (id === 'clientSearch') { state.clientSearch = e.target.value; const pos = e.target.selectionStart; $('#view').innerHTML = viewClients(); const inp = $('#clientSearch'); inp.focus(); inp.setSelectionRange(pos, pos); }
  else if (e.target.closest('#planForm')) {
    updatePreview();
    if (id === 'np_name') { const c = DB.clients.find(x => x.name === e.target.value); if (c && !$('#np_phone').value) $('#np_phone').value = c.phone; }
  }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'planDoctor') { state.planDoctor = el.value; $('#plansList').innerHTML = plansListHtml(); }
  else if (el.id === 'repFrom' || el.id === 'repTo') { state[el.id] = el.value; render(); }
  else if (el.dataset.role) { const u = byId('users', el.dataset.role); if (u) { await save('users', { ...u, role: el.value }, t('saved')); await log('user.role', { name: u.name, role: el.value }); } }
  else if (el.id === 'logDay') { state.logDay = el.value > TODAY ? TODAY : (el.value || TODAY); render(); }
  else if (el.id === 'logUser') { state.logUser = el.value; render(); }
  else if (el.id === 'nf_type') { const w = $('#nf_promWrap'); if (w) w.hidden = el.value !== 'promise'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal')?.innerHTML) closeModal(); else if (state.drawer) { state.drawer = null; renderDrawer(); } } });

B.init();
</script>
